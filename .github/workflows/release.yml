name: Release Apple Silicon setup app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notarized-release:
    runs-on: macos-15
    env:
      SIGN_IDENTITY: "Developer ID Application: ${{ secrets.APPLE_DEVELOPER_ID_NAME }} (${{ secrets.APPLE_TEAM_ID }})"
      NOTARY_PROFILE: codex-gamepad-ci
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Apple release secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" ]]
          [[ -n "$APPLE_ID" && -n "$APP_PASSWORD" && -n "$TEAM_ID" ]]

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/codex-gamepad.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN"

      - name: Store notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"

      - name: Download pinned arm64 uv
        shell: bash
        run: |
          curl -fL --retry 3 \
            https://github.com/astral-sh/uv/releases/download/0.11.14/uv-aarch64-apple-darwin.tar.gz \
            -o "$RUNNER_TEMP/uv.tar.gz"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "UV_ARM64=$RUNNER_TEMP/uv-aarch64-apple-darwin/uv" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        shell: bash
        run: |
          scripts/build-setup-app.sh \
            --version "${{ steps.version.outputs.value }}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --uv "$UV_ARM64" \
            --identity "$SIGN_IDENTITY" \
            --notary-profile "$NOTARY_PROFILE" \
            --notarize

      - uses: actions/upload-artifact@v4
        with:
          name: codex-gamepad-setup-${{ steps.version.outputs.value }}-arm64
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Codex Gamepad $GITHUB_REF_NAME"
