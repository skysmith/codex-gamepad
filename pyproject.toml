[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-gamepad"
version = "0.1.0"
description = "Turn a DirectInput gamepad into a focused Codex controller, with local Kokoro speech."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Codex Gamepad contributors" }]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
kokoro = [
  "kokoro-onnx==0.5.0",
  "soundfile>=0.12,<1",
]
test = ["pytest>=8,<10"]

[project.scripts]
codex-speak-last = "codex_gamepad.cli:main"

[project.urls]
Repository = "https://github.com/skysmith/codex-gamepad"
Issues = "https://github.com/skysmith/codex-gamepad/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
